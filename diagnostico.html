<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico de gestión — LideraIA</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F4EF;--card:#FBFAF6;--ink:#1C2022;--ink-soft:#54595C;--ink-mute:#8B9093;
  --line:#DBD8CD;--accent:#1E5A52;--accent-hi:#2E7A6F;--accent-soft:#E2ECE9;--warm:#B4653F;--warm-soft:#F2E4DB;
  --amber:#C7952C;--amber-soft:#F4ECD8;
}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--paper);min-height:100vh;-webkit-font-smoothing:antialiased}

.header{padding:20px 24px;text-align:center}
.header a{font-family:'Fraunces',serif;font-weight:600;font-size:17px;color:var(--ink);text-decoration:none}
.header a span{color:var(--accent)}

.container{max-width:560px;margin:0 auto;padding:0 24px}
.container.wide{max-width:640px}

.screen{display:none;opacity:0;transform:translateY(14px);transition:all .5s cubic-bezier(.22,1,.36,1)}
.screen.active{display:block}
.screen.visible{opacity:1;transform:translateY(0)}

/* Welcome */
.welcome-mark{width:72px;height:72px;margin-bottom:26px}
.welcome-mark svg{width:100%;height:100%}
h1{font-family:'Fraunces',serif;font-weight:500;font-size:30px;line-height:1.15;margin-bottom:14px;letter-spacing:-.3px}
.intro{font-size:15.5px;color:var(--ink-soft);line-height:1.7;margin-bottom:10px}
.intro:last-of-type{margin-bottom:32px}
.btn-primary{background:var(--ink);color:var(--paper);border:none;padding:14px 34px;border-radius:2px;font-size:15.5px;font-family:'Inter',sans-serif;font-weight:600;cursor:pointer;transition:all .25s}
.btn-primary:hover{background:var(--accent);transform:translateY(-2px)}
.note{font-size:12px;color:var(--ink-mute);margin-top:14px}

/* Progress diana */
.prog-row{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.prog-mark{width:46px;height:46px;flex-shrink:0}
.prog-mark svg{width:100%;height:100%;transform:rotate(-90deg)}
.prog-mark .pm-arc{transition:stroke-dashoffset .5s cubic-bezier(.22,1,.36,1)}
.progress-label{font-size:12.5px;color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase}

/* Question */
h2{font-family:'Fraunces',serif;font-weight:500;font-size:21.5px;line-height:1.35;margin-bottom:22px;letter-spacing:-.2px}
.q-subtitle{font-family:'Fraunces',serif;font-size:14px;color:var(--ink-mute);font-style:italic;line-height:1.5;margin-top:-14px;margin-bottom:20px}
.options{display:flex;flex-direction:column;gap:9px}
.opt{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:2px;padding:13px 16px;text-align:left;font-size:14.5px;font-family:'Inter',sans-serif;line-height:1.5;cursor:pointer;transition:all .2s;position:relative}
.opt:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateX(3px)}
.opt.selected{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.q-nav{display:flex;justify-content:space-between;margin-top:28px}
.btn-back{background:none;border:none;color:var(--ink-mute);font-family:'Inter',sans-serif;font-size:13.5px;cursor:pointer}
.btn-back:hover{color:var(--ink)}
.btn-next{background:var(--ink);color:var(--paper);border:none;padding:12px 26px;border-radius:2px;font-size:15px;font-family:'Inter',sans-serif;font-weight:600;cursor:pointer;transition:all .2s}
.btn-next:hover:not(:disabled){background:var(--accent)}
.btn-next:disabled{background:var(--line);color:var(--ink-mute);cursor:default}

/* Results header */
.result-header{background:var(--ink);border-radius:2px;padding:30px 26px 26px;margin-bottom:16px;position:relative;overflow:hidden}
.result-header .circle1{position:absolute;top:-30px;right:-30px;width:130px;height:130px;border-radius:50%;border:1.5px solid rgba(46,122,111,.35)}
.result-header .circle2{position:absolute;bottom:-24px;left:-24px;width:90px;height:90px;border-radius:50%;border:1.5px solid rgba(245,244,239,.08)}
.result-header-inner{position:relative;z-index:1}
.result-meta{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.tag{font-size:11px;color:var(--accent-hi);font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.fit-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:2px;font-size:11px;font-weight:600}
.fit-alto{background:rgba(46,122,111,.18);color:#7FBFB2}
.fit-bajo{background:rgba(245,244,239,.08);color:rgba(245,244,239,.5)}
.fit-dot{width:7px;height:7px;border-radius:50%}
.result-title{font-family:'Fraunces',serif;font-weight:500;font-size:24px;color:var(--paper);line-height:1.3;margin-bottom:20px}

.scale{margin-bottom:4px}
.scale-track{position:relative;height:42px;margin-bottom:6px}
.scale-bg{position:absolute;top:15px;left:0;right:0;height:6px;border-radius:3px;background:rgba(245,244,239,.1)}
.scale-fill{position:absolute;top:15px;left:0;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--warm),var(--accent-hi));width:0;transition:width 1.2s cubic-bezier(.22,1,.36,1)}
.scale-marker{position:absolute;top:8px;left:0;transform:translateX(-50%);transition:left 1.2s cubic-bezier(.22,1,.36,1);z-index:2}
.scale-dot{width:20px;height:20px;border-radius:50%;background:var(--paper);border:5px solid var(--accent-hi);box-shadow:0 2px 10px rgba(0,0,0,.3)}
.scale-labels{display:flex;justify-content:space-between;font-size:10.5px;color:rgba(245,244,239,.4)}

/* Cards */
.card{background:var(--card);border-radius:2px;padding:22px 20px;border:1px solid var(--line);margin-bottom:14px}
.card-accent{background:var(--accent-soft);border-left:3px solid var(--accent)}
.card-honesty{background:var(--amber-soft);border:1px solid #E3D5B2}
.section-label{font-size:11.5px;font-weight:700;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px}
.body-text{font-size:14.5px;color:var(--ink-soft);line-height:1.75}
.body-text+.body-text{margin-top:14px}

/* Dimensions */
.dim{margin-bottom:16px}
.dim-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.dim-label{font-size:13px;font-weight:600}
.dim-level{font-size:11px;font-weight:700;padding:2px 10px;border-radius:2px}
.dim-desc{font-size:11.5px;color:var(--ink-mute);margin-bottom:6px;line-height:1.4}
.dim-track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.dim-fill{height:100%;border-radius:3px;width:0;transition:width 1s cubic-bezier(.22,1,.36,1)}

/* Hours */
.hours-card{display:flex;align-items:center;gap:18px;padding:22px 24px;background:var(--ink);border:none}
.hours-circle{min-width:64px;height:64px;border-radius:50%;border:2px solid var(--accent-hi);display:flex;align-items:center;justify-content:center;flex-direction:column}
.hours-num{font-family:'Fraunces',serif;font-weight:600;font-size:21px;color:var(--accent-hi);line-height:1}
.hours-unit{font-size:9px;color:rgba(245,244,239,.5);font-weight:600;margin-top:2px}
.hours-text{font-size:14px;color:var(--paper);line-height:1.5;font-weight:500}
.hours-sub{font-size:11.5px;color:rgba(245,244,239,.45);line-height:1.5;margin-top:4px}

/* Pain */
.pain-label{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.pain-detail{font-size:14px;color:var(--ink-soft);line-height:1.65;margin-top:8px}

/* Before/After */
.ba-grid{display:grid;grid-template-columns:1fr 1fr;border-radius:2px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px}
.ba-col{padding:18px 16px}
.ba-before{background:var(--warm-soft);border-right:1px solid var(--line)}
.ba-after{background:var(--accent-soft)}
.ba-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.ba-tag-before{color:var(--warm)}
.ba-tag-after{color:var(--accent)}
.ba-text{font-size:13px;line-height:1.6;color:var(--ink-soft)}
.ba-portlink{background:var(--card);border:1px solid var(--line);border-top:none;padding:11px 16px;margin-top:-14px;margin-bottom:14px}
.ba-portlink a{font-size:12.5px;color:var(--accent);font-weight:600;text-decoration:none;border-bottom:2px solid var(--accent);padding-bottom:1px}

/* Recommendation */
.card-rec{background:var(--card);border:1.5px solid var(--accent);position:relative;overflow:hidden}
.card-rec .rec-circle{position:absolute;top:-36px;right:-36px;width:120px;height:120px;border-radius:50%;border:1.5px solid rgba(30,90,82,.18);pointer-events:none}
.rec-inner{position:relative;z-index:1}
.rec-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.rec-eyebrow{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.09em;padding-top:5px}
.rec-price-wrap{text-align:right}
.rec-price{font-family:'Fraunces',serif;font-weight:600;font-size:27px;line-height:1}
.rec-price-tag{display:block;font-size:10px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.rec-pay{display:block;font-size:11px;color:var(--ink-soft);font-weight:500;margin-top:6px}
.rec-title{font-family:'Fraunces',serif;font-weight:600;font-size:22px;line-height:1.25;margin-bottom:6px}
.rec-sessions{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:.28rem .6rem;border-radius:2px;margin-bottom:12px}
.rec-text{font-size:14.5px;color:var(--ink-soft);line-height:1.7}
.rec-meta{font-size:12.5px;color:var(--accent);font-weight:600;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.rec-pricenote{font-size:11.5px;color:var(--ink-mute);margin-top:8px;line-height:1.5}
.rec-alt{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-top:14px;padding:11px 14px;background:var(--paper);border-radius:2px;border:1px dashed var(--line)}

/* Explainer */
.explain-item{padding:14px 0;border-bottom:1px solid var(--line)}
.explain-item:last-of-type{border-bottom:none}
.explain-head{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--accent);margin-bottom:5px}
.explain-desc{font-size:13.5px;color:var(--ink-soft);line-height:1.6}
.explain-egs-label{font-size:11px;font-weight:700;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.05em;margin-top:11px;margin-bottom:7px}
.explain-egs{list-style:none;display:flex;flex-direction:column;gap:8px}
.explain-egs li{font-size:13px;color:var(--ink-soft);line-height:1.55;padding-left:19px;position:relative}
.explain-egs li::before{content:'';position:absolute;left:0;top:6px;width:8px;height:8px;border:2px solid var(--accent);border-radius:50%}
.explain-egs strong{color:var(--ink);font-weight:600}
.explain-foot{font-size:13px;color:var(--ink-soft);line-height:1.6;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.explain-foot strong{color:var(--ink)}

/* Testimonial */
.card-testi{background:var(--ink);border:none;position:relative;overflow:hidden}
.card-testi::after{content:'';position:absolute;top:-40px;right:-40px;width:130px;height:130px;border-radius:50%;border:1.5px solid rgba(46,122,111,.3)}
.testi-quote{font-family:'Fraunces',serif;font-style:italic;font-size:16px;color:var(--paper);line-height:1.55;position:relative}
.testi-author{font-size:11px;color:var(--accent-hi);font-weight:700;margin-top:12px;text-transform:uppercase;letter-spacing:.07em;position:relative}

/* honesty */
.honesty{font-size:13.5px;color:#6E5A38;line-height:1.6}

/* CTA */
.cta-text{font-size:14.5px;line-height:1.65;font-weight:500;margin-bottom:18px}
.alt-cta{font-size:13px;color:var(--ink-mute);margin-top:14px}
.inline-form{display:none;flex-direction:column;gap:10px}
.inline-form.open{display:flex}
.inline-form .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline-form input,.inline-form textarea{width:100%;padding:11px 14px;border-radius:2px;border:1px solid var(--line);font-size:14px;font-family:'Inter',sans-serif;color:var(--ink);background:var(--card);outline:none;transition:border-color .2s;box-sizing:border-box}
.inline-form input:focus,.inline-form textarea:focus{border-color:var(--accent)}
.inline-form textarea{resize:vertical}
.form-note{font-size:11px;color:var(--ink-mute);text-align:center;line-height:1.5}
.form-success{text-align:center;padding:24px 16px}
.form-success-icon{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:18px;color:var(--accent)}

.diag-footer{text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);margin-bottom:20px}
.restart{background:none;border:none;color:var(--ink-mute);font-family:'Inter',sans-serif;font-size:12.5px;cursor:pointer;margin:20px auto 8px;display:block}

@media(max-width:600px){
h1{font-size:26px}
.result-title{font-size:21px}
.ba-grid{grid-template-columns:1fr}
.ba-before{border-right:none;border-bottom:1px solid var(--line)}
.inline-form .frow{grid-template-columns:1fr}
.result-meta{flex-direction:column}
.rec-top{flex-direction:column}
.rec-price-wrap{text-align:left}
}
.centered-layout{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.results-layout{padding-top:0;padding-bottom:40px}
</style>
</head>

<script>

};

let state={phase:"welcome",qi:0,answers:Array(8).fill(null),result:null};

/* ══════════ SCORING ══════════ */
function score(){
const a=state.answers;
const dims={info:[],efficiency:[],tools:[],strategic:[]};
Q.forEach((q,i)=>{if(q.dim&&a[i]!==null)dims[q.dim].push(q.opts[a[i]].s)});
const dA={};Object.keys(dims).forEach(d=>{const arr=dims[d];dA[d]=arr.length?arr.reduce((s,v)=>s+v,0)/arr.length:2});
let total=0;[0,1,2,4,5,6].forEach(i=>{if(a[i]!==null)total+=Q[i].opts[a[i]].s});
const pain=a[3]!==null?Q[3].opts[a[3]].v:"visibility";
const intent=a[7]!==null?Q[7].opts[a[7]].v:"unsure";
const hours=a[2]!==null?Q[2].opts[a[2]].h:[1,1.5];
const usesAI=a[4]===2;const q6=a[5],q7=a[6];
const surv=q6===3||(q6===2&&q7===3);
let pid;if(total>=19)pid=4;else if(surv)pid=3;else if(usesAI&&total>=10)pid=2;else pid=1;
const mat=Math.max(5,Math.min(95,Math.round(((total-6)/18)*100)));
let rec;
if(pid===4)rec="none";
else if(intent==="done")rec="done";
else if(intent==="learn")rec=(pid===3)?"done_survival":"learn";
else rec="unsure";
return{pid,dA,pain,hours,mat,intent,rec};
}

function levelOf(v){
if(v<=1.5)return{l:"Inicial",c:"#B4653F",bg:"#F2E4DB"};
if(v<=2.5)return{l:"En desarrollo",c:"#C7952C",bg:"#F4ECD8"};
if(v<=3.2)return{l:"Intermedio",c:"#2E7A6F",bg:"#E2ECE9"};
return{l:"Avanzado",c:"#1E5A52",bg:"#D8E6E2"};
}

/* ══════════ ACTIONS ══════════ */
function startQuiz(){state.phase="questions";state.qi=0;render();window.scrollTo(0,0)}
function selectOpt(i){state.answers[state.qi]=i;render()}
function goNext(){
if(state.answers[state.qi]===null)return;
if(state.qi<Q.length-1){state.qi++;render();window.scrollTo(0,0)}
else{state.result=score();state.phase="result";render();window.scrollTo(0,0)}
}
function goBack(){
if(state.qi>0){state.qi--;render();window.scrollTo(0,0)}
else{state.phase="welcome";render();window.scrollTo(0,0)}
}
function restart(){state={phase:"welcome",qi:0,answers:Array(8).fill(null),result:null};render();window.scrollTo(0,0)}

function showForm(){
document.getElementById("cta-area").style.display="none";
document.getElementById("inline-form").classList.add("open");
}

function submitForm(){
const n=document.getElementById("f-nombre").value;
const e=document.getElementById("f-email").value;
const c=document.getElementById("f-cargo").value;
const m=document.getElementById("f-mensaje").value;
if(!n||!e.includes("@")||!c)return;
const btn=document.getElementById("f-btn");
btn.textContent="Enviando…";btn.disabled=true;
fetch("https://formspree.io/f/xkokykwe",{
method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
body:JSON.stringify({nombre:n,email:e,cargo:c,mensaje:m,origen:"diagnostico"})
}).then(r=>{
if(r.ok){
document.getElementById("inline-form").style.display="none";
document.getElementById("form-success").style.display="block";
}else{btn.textContent="Error, intenta de nuevo";btn.disabled=false}
}).catch(()=>{btn.textContent="Error, intenta de nuevo";btn.disabled=false});
}

render();
